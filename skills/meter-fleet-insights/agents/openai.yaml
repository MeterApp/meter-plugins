interface:
  display_name: "Meter Fleet Insights"
  short_description: "Answer questions about a fleet's trips, bookings, drivers and money"
  default_prompt: "Use $meter-fleet-insights to answer a question about my fleet's trips, bookings, drivers, vehicles, earnings or accounting."
dependencies:
  tools:
    - type: "mcp"
      value: "meter"
      description: "Meter hosted MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://www.meterapp.co/api/mcp"
policy:
  allow_implicit_invocation: true
