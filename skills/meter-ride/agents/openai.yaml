interface:
  display_name: "Meter Ride"
  short_description: "Book, track or cancel your own taxi ride, with a preview first"
  default_prompt: "Use $meter-ride to book me a ride with my usual taxi company: confirm the addresses, show me the price and ask before booking."
dependencies:
  tools:
    - type: "mcp"
      value: "meter"
      description: "Meter hosted MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://www.meterapp.co/api/mcp"
policy:
  allow_implicit_invocation: true
