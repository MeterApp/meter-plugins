interface:
  display_name: "Meter Settings Changes"
  short_description: "Change fleet, booking, fare or personal settings with a dry run first"
  default_prompt: "Use $meter-settings-changes to change a setting in Meter: dry run, show me the changes, then apply after I confirm."
dependencies:
  tools:
    - type: "mcp"
      value: "meter"
      description: "Meter hosted MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://www.meterapp.co/api/mcp"
policy:
  allow_implicit_invocation: true
