name: Endpoint reachable

# The manifests hard-code the hosted MCP URLs. If one moves or breaks, every
# install silently stops working, so check them on a schedule rather than
# waiting for a bug report.
on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp:
    name: MCP endpoint (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        plugin: [fleet, rides]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The server in .mcp.json answers with the OAuth challenge and metadata
        run: python3 scripts/check_endpoint.py "${{ matrix.plugin }}"
