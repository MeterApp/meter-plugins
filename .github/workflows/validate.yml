name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
  # A client release can change what a manifest must contain; catch it before a
  # user does.
  schedule:
    - cron: "23 15 * * 1"
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Structure, wording and the endpoint are checked in the source repository before
# each publish; this repository only checks that each client installs what was
# published.
jobs:
  clients:
    name: Install in each client
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Claude Code accepts the manifests
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate ./fleet --strict
          claude plugin validate ./rides --strict

      - name: Codex installs each plugin by name
        run: |
          npm install --global @openai/codex
          CODEX_HOME="$(mktemp -d)"
          export CODEX_HOME
          codex plugin marketplace add . --json
          codex plugin list --available --json | tee /tmp/codex-plugins.json
          for plugin in meter-fleet meter-rides; do
            grep -q "\"pluginId\": \"$plugin@meterapp-meter\"" /tmp/codex-plugins.json
            codex plugin add "$plugin@meterapp-meter" --json
          done

      - name: The skills CLI discovers every skill
        run: |
          npm install --global skills
          skills add . --list 2>&1 | tee /tmp/skills.txt
          for skill in meter-fleet-insights meter-fleet-onboarding meter-settings-changes meter-driver-personal meter-api-explainer meter-ride meter-rider-personal; do
            grep -q "$skill" /tmp/skills.txt || { echo "missing skill: $skill" >&2; exit 1; }
          done
