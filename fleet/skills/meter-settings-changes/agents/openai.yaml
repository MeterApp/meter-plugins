interface:
  display_name: "Meter Settings Changes"
  short_description: "Preview and change fleet, driver, fare and website settings"
  default_prompt: "Use $meter-settings-changes to change a setting in Meter: dry run, show me the changes, then apply after I confirm."
dependencies:
  tools:
    - type: "mcp"
      value: "meter-fleet"
      description: "Meter for Drivers & Fleets hosted MCP server (OAuth sign-in)"
      transport: "streamable_http"
      url: "https://www.meterapp.co/api/mcp/fleet"
policy:
  allow_implicit_invocation: true
